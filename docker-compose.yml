# Runs on neo. A stock nginx container serves the static site from
# ./releases/current; the Cloudflare Tunnel points at the loopback port below.
#
# The site itself is not built here. ./deploy/deploy.sh builds it with Docker
# into ./releases/<id>/ and flips ./releases/current to the new build, then
# reloads nginx gracefully. The container keeps running through a deploy, so
# there is no window where the tunnel gets a 502.
#
#   ./deploy/deploy.sh         build, switch, reload
#   docker compose up -d       start nginx (deploy.sh does this too)

# Pinned so project resources are named `wongworks_*` whatever the checkout
# directory is called.
name: wongworks

services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      # Folders, not single files: git replaces files on pull, and a
      # single-file mount would keep serving the old copy.
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - ./releases:/srv/site:ro
    ports:
      # Loopback only. `8080:8080` would publish it on every interface and
      # bypass the tunnel.
      - '127.0.0.1:8080:8080'
