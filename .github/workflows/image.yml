# Builds the site image and pushes it to GitHub's container registry, for the
# K3s cluster. Separate from the webhook deploy in deploy/, which rebuilds on
# the host itself and does not use this image.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both cluster nodes are amd64. No layer cache, so every build refetches
      # the activity graph.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/wongywrongy/kyw-portfolio:${{ github.sha }}
            ghcr.io/wongywrongy/kyw-portfolio:latest
          # Mounted for `npm run build` only (the activity graph); never
          # stored in an image layer.
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
