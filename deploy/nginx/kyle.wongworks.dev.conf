# Host nginx on neo. The app runs in compose bound to 127.0.0.1:3000.
#
# Two server blocks on purpose. The public hostname reaches the site but NOT
# the CMS; the admin panel is served on a separate tailnet-only block. Without
# that split, proxying the public hostname straight through would put /admin
# and the REST API on the internet — the one thing the whole setup avoids.

upstream wongworks_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Shared proxy plumbing. `Host` is preserved so Next generates correct absolute
# URLs; X-Forwarded-Proto tells it the edge terminated TLS.
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

# --- public: reached through the Cloudflare Tunnel --------------------------
server {
    listen 127.0.0.1:8080;
    server_name kyle.wongworks.dev;

    server_tokens off;

    # nginx does not merge add_header across levels: any nested location that
    # declares one drops every inherited header. Each block repeats the set.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy   "frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # The CMS is not part of the public surface. Closed here rather than only
    # in robots.txt, which is a hint and not a control.
    location /admin { return 404; }
    location /api   { return 404; }

    # Content-hashed build output: safe to cache hard at the edge and here.
    location /_next/static/ {
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy   "frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control             "public, max-age=31536000, immutable" always;
        proxy_pass http://wongworks_app;
    }

    location / {
        proxy_pass http://wongworks_app;
    }

    access_log /var/log/nginx/wongworks.access.log;
    error_log  /var/log/nginx/wongworks.error.log;
}

# --- private: admin over Tailscale only -------------------------------------
# Replace the listen address with neo's tailnet IP (`tailscale ip -4`). Do NOT
# add this hostname to the tunnel's ingress.
server {
    listen 100.75.156.61:8081;
    server_name neo;

    server_tokens off;

    # Uploads go through /api/media; Next's default body limit is small.
    client_max_body_size 25m;

    location / {
        proxy_pass http://wongworks_app;
    }

    access_log /var/log/nginx/wongworks-admin.access.log;
    error_log  /var/log/nginx/wongworks-admin.error.log;
}
