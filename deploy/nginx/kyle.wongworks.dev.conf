# nginx runs as a container in the wongworks compose stack and reaches the app
# over the compose network.
#
# Two server blocks on purpose. The public hostname reaches the site but NOT
# the CMS; the admin panel is served on a separate tailnet-only block. Without
# that split, proxying the public hostname straight through would put /admin
# and the REST API on the internet — the one thing the whole setup avoids.
#
# Both blocks listen on all interfaces *inside the container*. The interface
# each one is actually exposed on is decided by the port mapping in
# docker-compose.yml — 8080 to loopback, 8081 to the tailnet address. Binding
# a host IP here would fail; the container has neither.

upstream wongworks_app {
    # Compose service name, resolved on the stack's network. Not 127.0.0.1 —
    # inside this container that is nginx itself.
    server app:3000;
    keepalive 32;
}

# Websocket upgrade, keepalive-safe. For a normal request $http_upgrade is
# empty, so Connection is sent empty and the upstream keepalive above still
# applies; only a real upgrade request sends `Connection: upgrade`. A bare
# `Connection ""` would keep keepalive but silently break the admin websocket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# --- public: reached through the Cloudflare Tunnel --------------------------
server {
    # Mapped to 127.0.0.1:8080 on the host by compose.
    listen 8080;
    server_name kyle.wongworks.dev;

    server_tokens off;

    # Scoped to this server on purpose. At http level these would apply to every
    # proxying vhost on the host — including forcing X-Forwarded-Proto https on
    # unrelated sites.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # nginx does not merge add_header across levels: any nested location that
    # declares one drops every inherited header. Each block repeats the set.
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy   "frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # The CMS is not part of the public surface. Closed here rather than only
    # in robots.txt, which is a hint and not a control.
    location /admin { return 404; }
    location /api   { return 404; }

    # Content-hashed build output: safe to cache hard at the edge and here.
    location /_next/static/ {
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy   "frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control             "public, max-age=31536000, immutable" always;
        proxy_pass http://wongworks_app;
    }

    location / {
        proxy_pass http://wongworks_app;
    }

    access_log /var/log/nginx/wongworks.access.log;
    error_log  /var/log/nginx/wongworks.error.log;
}

# --- private: admin over Tailscale only -------------------------------------
# Exposed only on the tailnet, via the TAILNET_IP port mapping in compose. Do
# NOT add this hostname to the tunnel's ingress.
server {
    listen 8081;
    server_name _;

    server_tokens off;

    # Uploads go through /api/media; Next's default body limit is small.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location / {
        proxy_pass http://wongworks_app;
    }

    access_log /var/log/nginx/wongworks-admin.access.log;
    error_log  /var/log/nginx/wongworks-admin.error.log;
}
