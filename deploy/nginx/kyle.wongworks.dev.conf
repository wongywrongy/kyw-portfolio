# Static site served from the web container. The Cloudflare Tunnel connects to
# the host's 127.0.0.1:8080, which compose maps to this port.
#
# Security headers live here because `output: 'export'` ignores headers() in
# next.config. nginx does not merge add_header across levels: a location that
# declares its own drops every inherited one, so each such location repeats the
# full set.

server {
    listen 8080;
    server_name kyle.wongworks.dev _;

    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy   "frame-ancestors 'self'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    error_page 404 /404.html;

    # Retired pages and the old CMS surface.
    location = /work/all     { return 301 /; }
    location = /projects/all { return 301 /; }
    location = /mindspace/all { return 301 /; }
    location /admin { return 404; }
    location /api   { return 404; }

    # Emitted so `next build` can succeed with no published posts; never a page.
    location ^~ /mindspace/_none { return 404; }

    # Content-hashed build output.
    location /_next/static/ {
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy   "frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control             "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy   "frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Cache-Control             "public, max-age=300, must-revalidate" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
